<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Your Name</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            text-align: center;
        }

        header {
            padding: 80px 20px;
            background: linear-gradient(135deg, #4f46e5, #9333ea);
        }

        h1 {
            font-size: 3rem;
            margin: 0;
        }

        p {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .section {
            padding: 60px 20px;
        }

        .btn {
            display: inline-block;
            padding: 12px 24px;
            background: #4f46e5;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            margin-top: 20px;
        }

        footer {
            padding: 20px;
            background: #000;
            font-size: 0.9rem;
            opacity: 0.6;
        }
    </style>
</head>
<body>

<header>
    <h1>Hello, I'm Your Name</h1>
    <p>Developer | Fitness Enthusiast | Creator</p>
    <a href="#about" class="btn">Learn More</a>
</header>

<div class="section" id="about">
    <h2>About Me</h2>
    <p>I build things. I solve problems. I grow every day.</p>
</div>

<div class="section">
    <h2>Projects</h2>
    <p>Coming soon...</p>
</div>

<footer>
    © 2026 Your Name
</footer>

</body>
</html>
